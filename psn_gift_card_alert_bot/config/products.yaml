  #   1. The page is server-rendered and embeds window.__INITIAL_STATE with
  #      the product (sku B2CEGVGBPS001, upc.id 7864), the offered slab
  #      list price.denominations = [1000, 2000, 3000, 4000, 5000] and the
  #      slab amounts. The page carries NO stock field at all -- the default
  #      slab display and the quantity limit (max 10) are configuration,
  #      never stock, and are not read as stock.
  #   2. Stock comes from the site's own inventory ledger:
  #        GET /proxy/locale/en-in/product/inventories
  #            ?searchCriteria[filter_groups][0][filters][0][field]
  #              =universalProductCodes.entityId
  #            &...[condition_type]=eq&...[value]=7864
  #            &searchCriteria[limit]=2000&searchCriteria[offset]=0
  #      The shipped bundle proves the direction of the signal: it maps each
  #      returned row's denomination into outOfStockDenominations, blocks
  #      cart items whose price is in that set ("Item is out of stock..."),
  #      and the denomination selector switches away from a listed value.
  #      Control brands that are normally purchasable (AJIO E-Gift Card,
  #      Ajio Luxe) return inventories: []. Checked live 2026-11-12:
  #      PlayStation currently returns all five denominations as rows
  #      (ledger rows dated 2026-11-05..09), i.e. every slab is currently
  #      OUT_OF_STOCK -- an explicit reading, not an inference.
  #
  # Failure handling (why this is safe to enable after verification):
  #   * ledger fetch fails / bad JSON / wrong shape -> status preserved
  #     (never OUT_OF_STOCK, never IN_STOCK);
  #   * ledger "total" larger than the rows returned -> UNKNOWN;
  #   * a configured denomination missing from the page's offered slabs
  #     -> UNKNOWN (not offered is not the same as out of stock);
  #   * a row without any denomination -> whole product OUT_OF_STOCK
  #     (the bundle's isProductOutOfStock).
  #
  # To enable: python github_runner.py --dry-run, confirm every entry reads
  # OUT_OF_STOCK today (or IN_STOCK if a slab restocked) rather than
  # UNKNOWN, then set enabled: true. The runner already annotates each run
  # with "woohoo-psn-1000: disabled entry now reads OUT_OF_STOCK -- verify
  # ..." while these stay disabled.
