# Add one entry per product/denomination/retailer.
# Selectors are optional. If the page has no clear stock indicator, status stays UNKNOWN
# rather than incorrectly reporting the item as available.
products:
  - id: rooter-psn-1000
    retailer: Rooter
    denomination: 1000
    url: https://shop.rooter.gg/product/playstation-gift-cards
    # Rooter uses selectable variants; page-wide text alone may not identify the
    # selected denomination's stock. Verify and add selectors after inspecting the page.
    availability_selector: ""
    price_selector: ""
    discount_selector: ""
    cashback_selector: ""
    in_stock_patterns:
      - "in stock"
      - "available"
      - "buy now"
    out_of_stock_patterns:
      - "out of stock"
      - "sold out"
    enabled: false
