# ─────────────────────────────────────────────────────────────────────────────
# ADDING A NEW RETAILER SAFELY
# ─────────────────────────────────────────────────────────────────────────────
# Do not add and enable an entry without checking the raw HTML first.
#
#   1. Open the exact product page and use "View Page Source".
#   2. Confirm the price and stock wording appear in that raw source.
#   3. If it does, the page is client-rendered - it cannot be monitored here
#      unless a non-/api/ server-rendered source exists.
#   4. If it does, copy the CSS selector (F12 -> right click -> Copy selector)
#      and test it. Only then set enabled: true.
# ─────────────────────────────────────────────────────────────────────────────
