  #     Disallow: /api/
  # Fetching it anyway would violate that policy, so we do not.
  # The search URL below is real and reachable, but it also renders client-side
  # ("Loading results..."), so a plain HTTP request sees no products.
  #
  # To enable later you need BOTH:
  #   1. the exact product page UUID (from the site's own navigation or
  #      https://www.gamestheshop.com/sitemap.xml), and
  #   2. a server-rendered data source that is not under /api/.
  # If neither exists, this retailer cannot be monitored here.
  - id: gamestheshop-psn-1000
    retailer: Games The Shop
    denomination: 1000
    url: ""
    extractor: html_text
    availability_selector: ""
    price_selector: ""
    discount_selector: ""
