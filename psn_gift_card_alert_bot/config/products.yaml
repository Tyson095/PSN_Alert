  # ── e2z Store ─────────────────────────────────────────────────────────────
  # VERIFIED 2026-11-09. Earlier this store sat behind a Cloudflare managed
  # challenge and returned 403 to every path; it now answers a plain GET with
  # full server-rendered HTML (200, ~300-740 KB) and no challenge header.
  # robots.txt: "User-agent: * / Allow: /". No bypass of any kind is used --
  # a normal request is enough, so no circumvention is involved.
  #
  # Availability comes from the page's schema.org JSON-LD, which is present in
  # both states and reports schema.org/InStock | OutOfStock.
  #
  # WHY NOT <p class="stock ...">: this WooCommerce theme only renders that
  # element while the product is OUT of stock. On an in-stock page it is
  # absent entirely. A selector on it therefore returns "matched nothing"
  # precisely when the product comes back -- reading a real restock as
  # UNKNOWN and never firing the alert. Found on 2026-11-09 when 2000/4000
  # came in stock and the bot reported UNKNOWN instead.
  # The class-based and text-pattern fallbacks are deliberately gone: they
  # shared the same blind spot.
  #
  # The JSON-LD is wrapped in a "@graph" node (WordPress SEO plugin), so the
  # extractor walks the whole tree rather than only the top level.
  #
  # 2026-11-13 UPDATE -- per-URL challenge, plus a Store API fallback source.
  # Since 2026-11-11 14:06 IST five of the six product pages answer 403 with
  # "cf-mitigated: challenge" (Cloudflare managed challenge), from the GitHub
  # runner AND from a residential IP alike, while the Rs.7000 page still
  # answers 200 -- a per-URL rule, not an IP block. Failed reads keep their
  # last-known status; no bypass of any kind is attempted.
  #
  # FALLBACK SOURCE -- read ONLY when the primary page fetch or parse fails:
  #   https://e2zstore.com/wp-json/wc/store/v1/products?slug=<page slug>
  # robots.txt is "User-agent: * / Allow: /" with no /wp-json/ disallow, and
  # the endpoint answers plain GETs with unchallenged 200 JSON (verified
  # 2026-11-13 from both networks). It carries real stock fields
  # (is_in_stock, is_purchasable) that agreed with the pages' JSON-LD on
  # every sample: 2/2 listed products matched their pages, and 8/8 sampled
  # products absent from the listing read schema.org/OutOfStock on their
  # readable pages. The store excludes out-of-stock products from the
  # catalogue query -- all 2762 listed products read is_in_stock: true --
  # so the extractor treats "listed with matching slug and price" as a
  # reading and "absent" as UNKNOWN. Absence is NEVER OUT_OF_STOCK: a
  # renamed, hidden or restructured product must not fake a stockout (and
  # therefore must not fake a restock either).
  #
  # Known limitation: an entry last witnessed IN_STOCK before the challenge
  # reads UNKNOWN while the store hides it from the catalogue; its next
  # restock updates the report but cannot alert until an OUT_OF_STOCK has
  # been witnessed (the state file shows which entries those are). If the
  # pages stop being challenged, the primary JSON-LD read resumes and full
  # transition alerting is restored.
  #
  # First run records a baseline and alerts nothing, by design.
  - id: e2z-psn-1000
    retailer: e2z Store
    denomination: 1000
    url: https://e2zstore.com/product/rs-1000-playstation-network-wallet-top-up/
    extractor: jsonld_offers
    fallback:
      url: https://e2zstore.com/wp-json/wc/store/v1/products?slug=rs-1000-playstation-network-wallet-top-up
      extractor: wc_store_api
    enabled: true
    verification: verified-2026-11-09

  - id: e2z-psn-2000
    retailer: e2z Store
    denomination: 2000
    url: https://e2zstore.com/product/rs-2000-playstation-network-wallet-top-up/
    extractor: jsonld_offers
    fallback:
      url: https://e2zstore.com/wp-json/wc/store/v1/products?slug=rs-2000-playstation-network-wallet-top-up
      extractor: wc_store_api
    enabled: true
    verification: verified-2026-11-09

