  # ── e2z Store ─────────────────────────────────────────────────────────────
  # VERIFIED 2026-11-09. Earlier this store sat behind a Cloudflare managed
  # challenge and returned 403 to every path; it now answers a plain GET with
  # full server-rendered HTML (200, ~300-740 KB) and no challenge header.
  # robots.txt: "User-agent: * / Allow: /". No bypass of any kind is used --
  # a normal request is enough, so no circumvention is involved.
  #
  # Availability comes from the page's schema.org JSON-LD, which is present in
  # both states and reports schema.org/InStock | OutOfStock.
  #
  # WHY NOT <p class="stock ...">: this WooCommerce theme only renders that
  # element while the product is OUT of stock. On an in-stock page it is
  # absent entirely. A selector on it therefore returns "matched nothing"
  # precisely when the product comes back -- reading a real restock as
  # UNKNOWN and never firing the alert. Found on 2026-11-09 when 2000/4000
  # came in stock and the bot reported UNKNOWN instead.
  # The class-based and text-pattern fallbacks are deliberately gone: they
  # shared the same blind spot.
  #
  # The JSON-LD is wrapped in a "@graph" node (WordPress SEO plugin), so the
  # extractor walks the whole tree rather than only the top level.
  #
  # First run records a baseline and alerts nothing, by design.
  - id: e2z-psn-1000
    retailer: e2z Store
    denomination: 1000
    url: https://e2zstore.com/product/rs-1000-playstation-network-wallet-top-up/
    extractor: jsonld_offers
    enabled: true
    verification: verified-2026-11-09

  - id: e2z-psn-2000
    retailer: e2z Store
    denomination: 2000
    url: https://e2zstore.com/product/rs-2000-playstation-network-wallet-top-up/
    extractor: jsonld_offers
    enabled: true
    verification: verified-2026-11-09

  - id: e2z-psn-3000
    retailer: e2z Store
    denomination: 3000
    url: https://e2zstore.com/product/rs-3000-playstation-network-wallet-top-up/
    extractor: jsonld_offers
    enabled: true
    verification: verified-2026-11-09

  - id: e2z-psn-4000
    retailer: e2z Store
    denomination: 4000
    url: https://e2zstore.com/product/rs-4000-playstation-network-wallet-top-up/
    extractor: jsonld_offers
    enabled: true
    verification: verified-2026-11-09

  - id: e2z-psn-5000
    retailer: e2z Store
    denomination: 5000
    url: https://e2zstore.com/product/rs-5000-playstation-store-gift-card-wallet-top-up/
    extractor: jsonld_offers
    enabled: true
    verification: verified-2026-11-09

  # e2z also lists a Rs.7000 PSN card (verified reachable, currently out of
  # stock). It sat outside the originally requested 1000-5000 range and was
  # left disabled rather than silently widening what gets monitored; enabled
  # on request, since it is verified and reads through the same extractor.
  - id: e2z-psn-7000
    retailer: e2z Store
    denomination: 7000
    url: https://e2zstore.com/product/rs-7000-sony-playstation-store-gift-card-wallet-top-up/
    extractor: jsonld_offers
    enabled: true
    verification: verified-2026-11-09
    notes: "Verified reachable and readable; Rs.7000 is outside the originally requested 1000-5000 range."

  # ── StanShop ──────────────────────────────────────────────────────────────
  # VERIFIED 2026-11-09. Two hostnames exist; only one is alive:
  #   store.getstan.app  -> HTTP 402 "DEPLOYMENT_DISABLED" (Vercel). Dead.
  #   www.stanshop.co    -> HTTP 200, full server-rendered HTML.
  # robots.txt: "User-agent: * / Allow: /". Plain GET, no bypass of anything.
  #
  # This is a Next.js App Router site with no WooCommerce markup, so the
  # html_text selectors do not apply. What it does publish is schema.org
  # JSON-LD with one Offer per denomination and a fixed availability
  # vocabulary (schema.org/InStock | OutOfStock) -- read by the jsonld_offers
  # extractor. The visible cards add the cashback wording JSON-LD omits
  # ("5 % cashback Get Upto 50 Coins"), scoped to this denomination only.
  #
  # Denominations offered: 1000, 2000, 3000, 4000. There is NO Rs.5000 card;
  # asking for it correctly reports UNKNOWN rather than a false stockout.
  # All four values live on one page, so they share the URL.
  - id: stan-psn-1000
    retailer: StanShop
    denomination: 1000
    url: https://www.stanshop.co/playstation-psn-gift-card-in-india
    extractor: jsonld_offers
    enabled: true
    verification: verified-2026-11-09

  - id: stan-psn-2000
    retailer: StanShop
    denomination: 2000
    url: https://www.stanshop.co/playstation-psn-gift-card-in-india
    extractor: jsonld_offers
    enabled: true
    verification: verified-2026-11-09

  - id: stan-psn-3000
    retailer: StanShop
    denomination: 3000
    url: https://www.stanshop.co/playstation-psn-gift-card-in-india
    extractor: jsonld_offers
    enabled: true
    verification: verified-2026-11-09

  - id: stan-psn-4000
    retailer: StanShop
    denomination: 4000
    url: https://www.stanshop.co/playstation-psn-gift-card-in-india
    extractor: jsonld_offers
    enabled: true
    verification: verified-2026-11-09

  # Not sold by StanShop. Kept so the gap is documented rather than silent;
  # jsonld_offers reports UNKNOWN for it, never OUT_OF_STOCK.
  - id: stan-psn-5000
    retailer: StanShop
    denomination: 5000
    url: https://www.stanshop.co/playstation-psn-gift-card-in-india
    extractor: jsonld_offers
    enabled: false
    verification: verified-2026-11-09
    notes: "StanShop publishes offers for 1000/2000/3000/4000 only. No Rs.5000 card exists."

  # ── Games The Shop ────────────────────────────────────────────────────────
