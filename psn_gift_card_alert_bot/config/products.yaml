# PlayStation gift card monitoring configuration.
#
# ─────────────────────────────────────────────────────────────────────────────
# HOW TO READ THIS FILE
# ─────────────────────────────────────────────────────────────────────────────
# enabled: true   -> the product is fetched every cycle. Only set this after
#                    you have confirmed the entry works (run the probe below).
# enabled: false  -> configured but NOT monitored. Unverified or blocked.
#
# extractor:
#   rooter_rsc    -> reads the Next.js payload Rooter ships inside its HTML.
#                    Gives a real per-denomination outOfStock flag + price.
#   html_text     -> classic CSS selectors + text patterns, for pages whose
#                    data is present in the server-rendered HTML. Optional
#                    in_stock_classes/out_of_stock_classes read the stock
#                    signal off the element's CSS class, which is more stable
#                    than wording that changes per product.
#   jsonld_offers -> reads schema.org JSON-LD offers, for sites that publish
#                    price and availability for machines rather than readers.
#   gyftr_api     -> reads GYFTR's own public brand-detail JSON feed, which
#                    publishes a per-product stock_left count. The brand page
#                    itself is an empty shell; the feed is the only source.
#   woohoo_api    -> reads Woohoo's server-rendered product page for the
#                    offered slabs (window.__INITIAL_STATE) and the site's
#                    own public inventory ledger for stock: a denomination
#                    listed there is OUT_OF_STOCK, an offered denomination
#                    that is absent is IN_STOCK. Two requests per cycle,
#                    each shared by all five Woohoo entries.
#
# Verify an entry before enabling it:
#   python github_runner.py --dry-run
# and check the status lines. UNKNOWN means "we could not tell" -- it is never
# reported as out of stock.
#
# IMPORTANT: a page that we cannot read must stay disabled or report UNKNOWN.
# Never enable an entry whose status is always UNKNOWN; that is a broken
# selector or an inaccessible page, not a real-world stock signal.
# ─────────────────────────────────────────────────────────────────────────────

products:
  # ── Rooter ────────────────────────────────────────────────────────────────
  # VERIFIED 2026-11-08. The URL is listed in https://shop.rooter.gg/sitemap.xml
  # and returns HTTP 200. robots.txt: "User-agent: * / Allow: /".
  # All five denominations live on one page, so they share a URL and are told
  # apart by variant_pattern, which matches the variation name the site itself
  # publishes (e.g. "Rs.1000 Wallet Code").
  - id: rooter-psn-1000
    retailer: Rooter
    denomination: 1000
    url: https://shop.rooter.gg/product/playstation-gift-cards
    extractor: rooter_rsc
    variant_pattern: 'Rs\.1000\b'
    enabled: true
    verification: verified-2026-11-08

