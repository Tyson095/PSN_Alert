# ─────────────────────────────────────────────────────────────────────────────
# OTHER INDIAN RETAILERS IDENTIFIED BUT NOT YET VERIFIED
# ─────────────────────────────────────────────────────────────────────────────
# These are legitimate Indian retailers that have carried PlayStation wallet
# codes in the past. None was confirmed to serve stock/price data in plain
# HTML during verification, so no entry has been created for them. Do not add
# and enable one without checking the raw HTML first.
#
#   Flipkart    flipkart.com            - heavy client-side rendering; usually
#                                         needs an account to see offers.
#   Croma       croma.com               - verify whether PSN codes are listed.
#   Vijay Sales vijaysales.com          - verify whether PSN codes are listed.
#   Snapdeal    snapdeal.com            - checked 2026-11-08: searching
#                                         "playstation gift card" returned
#                                         unrelated items (playing cards,
#                                         party supplies). No genuine PSN
#                                         listings found.
#
# Adding a new retailer safely:
#   1. Open the exact product page and use "View Page Source".
#   2. Confirm the price and stock wording appear in that raw source.
#   3. If it does, the page is client-rendered - it cannot be monitored here
#      unless a non-/api/ server-rendered source exists.
#   4. If it does, copy the CSS selector (F12 -> right click -> Copy selector)
#      and test it. Only then set enabled: true.
# ─────────────────────────────────────────────────────────────────────────────
