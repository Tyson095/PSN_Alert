  # ── e2z Store ─────────────────────────────────────────────────────────────
  # VERIFIED 2026-11-09. Earlier this store sat behind a Cloudflare managed
  # challenge and returned 403 to every path; it now answers a plain GET with
  # full server-rendered HTML (200, ~300-740 KB) and no challenge header.
  # robots.txt: "User-agent: * / Allow: /". No bypass of any kind is used --
  # a normal request is enough, so no circumvention is involved.
  #
  # Availability comes from the page's schema.org JSON-LD, which is present in
  # both states and reports schema.org/InStock | OutOfStock.
  #
  # WHY NOT <p class="stock ...">: this WooCommerce theme only renders that
  # element while the product is OUT of stock. On an in-stock page it is
  # absent entirely. A selector on it therefore returns "matched nothing"
  # precisely when the product comes back -- reading a real restock as
  # UNKNOWN and never firing the alert. Found on 2026-11-09 when 2000/4000
  # came in stock and the bot reported UNKNOWN instead.
  # The class-based and text-pattern fallbacks are deliberately gone: they
  # shared the same blind spot.
  #
  # The JSON-LD is wrapped in a "@graph" node (WordPress SEO plugin), so the
  # extractor walks the whole tree rather than only the top level.
  #
  # First run records a baseline and alerts nothing, by design.
  - id: e2z-psn-1000
    retailer: e2z Store
    denomination: 1000
    url: https://e2zstore.com/product/rs-1000-playstation-network-wallet-top-up/
    extractor: jsonld_offers
    enabled: true
    verification: verified-2026-11-09

  - id: e2z-psn-2000
    retailer: e2z Store
    denomination: 2000
    url: https://e2zstore.com/product/rs-2000-playstation-network-wallet-top-up/
    extractor: jsonld_offers
    enabled: true
    verification: verified-2026-11-09

  - id: e2z-psn-3000
    retailer: e2z Store
    denomination: 3000
    url: https://e2zstore.com/product/rs-3000-playstation-network-wallet-top-up/
