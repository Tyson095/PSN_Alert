  # ------------------------------------------------------------------ #
  # Blinkit (blinkit.com) - DATA PATH VERIFIED 2026-11-12;
  # DISABLED 2026-11-13 (runner IP blocked; see below).
  #
  # Sells the Sony PlayStation Instant Voucher in five denominations.
  # robots.txt allows /prn/ product pages (it disallows /cart, /checkout,
  # /account, /s/* search and a few sections - none of which we touch),
  # and the product page is server-rendered with schema.org JSON-LD:
  #
  #   {"@type":"Product","sku":"698590", ...,
  #    "offers":{"@type":"Offer",
  #              "availability":"https://schema.org/OutOfStock",
  #              "price":1000,"priceCurrency":"INR"}}
  #
  # That is the same fixed availability vocabulary jsonld_offers reads for
  # StanShop and e2z: the offer price must equal the configured
  # denomination, otherwise UNKNOWN. It is read through blinkit_jsonld,
  # which wraps jsonld_offers in a delivery-location guard (below).
  # The page also embeds window.grofers.PRELOADED_STATE whose PDP snippets
  # carry a per-variant list (product_id, mrp/price, inventory,
  # is_sold_out); JSON-LD and BFF agreed on every check so far.
  #
  # One URL per denomination (all fetched live 2026-11-12, HTTP 200,
  # correct sku and price, availability OutOfStock for all five):
  #   1000 -> /prn/sony-playstation-instant-voucher/prid/698590 (sitemap)
  #   2000 -> /prn/x/prid/698593
  #   3000 -> /prn/x/prid/698594
  #   4000 -> /prn/x/prid/699135
  #   5000 -> /prn/x/prid/698592
  # Blinkit's own share deeplink uses the /prn/x/prid/<id> form.
  #
  # Direction proven with a control the same day:
  # amazon-shopping-voucher/prid/586903 publishes availability InStock, so
  # InStock/OutOfStock are live values, not a static template.
  #
  # WHY DISABLED 2026-11-13: from GitHub-hosted runners every one of the
  # five URLs answers HTTP 403 - persistent for 11+ hours across hundreds
  # of attempts (~60 runs), while the identical URLs answer HTTP 200 from
  # a residential IP. That is an IP/ASN-based block, not a page change.
  # No bypass is attempted (no browser impersonation, no proxy, no auth,
  # no CAPTCHA). The entries stay configured and disabled; the per-cycle
  # probe still re-checks them (one plain GET per URL, silent on failure)
  # and will annotate the run the moment they read a real stock status
  # from an allowed network - that annotation is the cue to dry-run,
  # verify, and set enabled: true again.
  #
  # LOCATION GUARD (blinkit_jsonld): availability is rendered for ONE
  # delivery location. The SSR resolves a location first - IP-geolocated
  # by default; the runner's page resolved Gurugram coordinates with an
  # empty address book - and an unservable or missing location can sit
  # next to an OutOfStock offer. A location/serviceability error is not a
  # global stock fact: when isNonServiceable is set, or no coordinates
  # were resolved, the extractor returns UNKNOWN, never OUT_OF_STOCK.
  # With a resolved serviceable location the JSON-LD is read as before -
  # still scoped to that location, so treat an alert as "check the link".
  # Every fetch is one plain GET with the standard browser UA: no cookie,
  # login, cart or challenge involved.
  #
  # Verified 2026-11-12 with python github_runner.py --dry-run reading
  # OUT_OF_STOCK (a real status, not UNKNOWN) on all five entries; state
  # entries are preserved as-is while disabled.
  - id: blinkit-psn-1000
