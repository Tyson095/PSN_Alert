name: PSN Gift Card Monitor

# One-shot monitoring cycle. The script starts, checks every enabled product
# once, sends any notifications, writes state, and exits.
#
# Scheduling notes:
#   * GitHub Actions cron runs in UTC. Asia/Kolkata is UTC+05:30 with no DST,
#     so 09:00 IST is exactly 03:30 UTC.
#   * Scheduled runs are NOT executed on time. GitHub queues high-demand
#     minutes and routinely delays scheduled workflows by 5-30 minutes, and
#     occasionally much longer. Never rely on a scheduled run happening at an
#     exact minute. The runner therefore decides on *every* cycle whether the
#     daily report is still due, so a delayed tick still yields exactly one
#     report per day.
#   * The every-30-minutes schedule uses :07 and :37 rather than :00 and :30.
#     This is still a 30-minute interval, but it avoids the busiest marks where
#     GitHub is most likely to delay or queue runs.

on:
  workflow_dispatch:
    inputs:
      force_report:
        description: 'Send the daily report now (use to test Telegram delivery)'
        type: boolean
        default: false
  schedule:
    - cron: '7,37 * * * *'   # every 30 minutes
    - cron: '30 3 * * *'     # 09:00 Asia/Kolkata daily report

# Minimum permissions: the only write access needed is pushing the state file.
permissions:
  contents: write

# Never let two cycles run at the same time -- overlapping runs would race on
# the state file. Queued (not cancelled) so a running cycle finishes cleanly.
concurrency:
  group: psn-gift-card-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        # v5 runs on Node 24 (v4 targets the deprecated Node 20).
        uses: actions/checkout@v5
        with:
          # Full history so a defensive rebase before pushing state succeeds.
          fetch-depth: 0
          # Default GITHUB_TOKEN; needs contents:write (set above) to push.
          persist-credentials: true

      - name: Set up Python
        # v6 runs on Node 24 (v5 targets the deprecated Node 20).
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Regression gate: monitoring only runs when the full test suite passes.
      # A failing test stops the job here, before any retailer request or
      # Telegram message is made. Uses the existing dev dependencies
      # (requirements-dev.txt -> pytest); no new dependencies.
      - name: Install test dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest

      - name: Run one-shot monitoring cycle
        env:
          # Read from Actions secrets. Never echoed, never written to state.
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          # Destination chat. Configuration, not state: the runner reads it
          # from here only and never writes it to state/state.json or logs.
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TIMEZONE: Asia/Kolkata
          DAILY_REPORT_HOUR: '9'
          REQUEST_DELAY_SECONDS: '2'
        # force_report is a manual dispatch input only; schedule never sets it.
        run: |
          if [ "${{ inputs.force_report }}" = "true" ]; then
            python github_runner.py --report
          else
            python github_runner.py
          fi

      - name: Persist monitoring state
        # Only state/state.json is committed. Logs (.venv, runner.log, etc.)
        # are gitignored and never reach the repository.
        # Robust by construction: never merge or rebase. A rebase with
        # --autostash conflicts on state/state.json whenever origin/main moved
        # during the run (another state push, or a human push), which left the
        # tree with unmerged files and failed the job with exit code 128.
        # Instead: stash the state this run computed, hard-reset to origin,
        # restore it, commit, and push - retrying if the remote moved again.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ ! -f state/state.json ]; then
            echo "No state file produced this run - nothing to commit."
            exit 0
          fi

          # The state this run just computed is authoritative; keep it safe.
          cp state/state.json "${RUNNER_TEMP}/state.json"

          for attempt in 1 2 3; do
            git fetch origin "${GITHUB_REF_NAME}"
            git reset --hard "origin/${GITHUB_REF_NAME}"
            mkdir -p state
            cp "${RUNNER_TEMP}/state.json" state/state.json

            git add state/state.json
            if git diff --cached --quiet; then
              echo "State unchanged - nothing to commit."
              exit 0
            fi

            git commit -m "chore(state): update monitoring state [skip ci]"
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "State pushed."
              exit 0
            fi

            echo "::warning::State push rejected (attempt ${attempt}); origin moved - retrying."
          done

          echo "::warning::State push failed after 3 attempts; the next run will recompute it."
          exit 0
